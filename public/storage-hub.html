<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WWI Shared Storage Hub</title>
</head>
<body>
  <script>
    /**
     * WWI Cross-Subdomain Storage Hub
     * Runs on https://wwi.org.in/storage-hub.html
     * Bridges master localStorage access across all *.wwi.org.in subdomains
     */
    function isAllowedOrigin(origin) {
      if (!origin) return false;
      try {
        var u = new URL(origin);
        var host = u.hostname.toLowerCase();
        if (host === 'wwi.org.in' || host.endsWith('.wwi.org.in')) return true;
        if (host === 'localhost' || host === '127.0.0.1' || host.endsWith('.localhost')) return true;
        if (host.endsWith('.vercel.app')) return true;
      } catch (e) {}
      return false;
    }

    var masterBroadcastChannel = null;
    if (typeof BroadcastChannel !== 'undefined') {
      try {
        masterBroadcastChannel = new BroadcastChannel('wwi_master_hub_channel_v1');
        masterBroadcastChannel.onmessage = function (e) {
          if (e.data && e.data.type === 'WWI_HUB_BROADCAST' && window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'WWI_HUB_SYNC_INCOMING',
              key: e.data.key,
              value: e.data.value,
              ts: e.data.ts
            }, '*');
          }
        };
      } catch (e) {}
    }

    window.addEventListener('message', function (event) {
      if (!isAllowedOrigin(event.origin)) return;
      var data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'WWI_HUB_GET') {
        try {
          var val = localStorage.getItem(data.key);
          event.source.postMessage({
            type: 'WWI_HUB_RESPONSE',
            reqId: data.reqId,
            key: data.key,
            value: val
          }, event.origin);
        } catch (err) {}
      } else if (data.type === 'WWI_HUB_SET') {
        try {
          var finalVal = data.value;
          var incomingTs = data.ts ? parseInt(data.ts, 10) : Date.now();
          var currTsStr = localStorage.getItem(data.key + '_ts');
          var currTs = currTsStr ? parseInt(currTsStr, 10) : 0;

          // If incoming is newer or equal, incoming snapshot is the source of truth
          if (incomingTs >= currTs) {
            try {
              var curr = localStorage.getItem(data.key);
              if (curr) {
                var pCurr = JSON.parse(curr);
                var pIn = typeof data.value === 'string' ? JSON.parse(data.value) : data.value;
                if (Array.isArray(pCurr) && Array.isArray(pIn)) {
                  var mapCurr = {};
                  pCurr.forEach(function (it) {
                    if (it && typeof it === 'object') {
                      var id = it.id || it.slug;
                      if (id) mapCurr[id] = it;
                    }
                  });
                  // Map strictly over pIn so deleted items remain deleted
                  var updatedIn = pIn.map(function (it) {
                    if (it && typeof it === 'object') {
                      var id = it.id || it.slug;
                      var ex = id ? mapCurr[id] : null;
                      if (!it.content && ex && ex.content) {
                        var cloned = {};
                        for (var a in it) { cloned[a] = it[a]; }
                        cloned.content = ex.content;
                        return cloned;
                      }
                    }
                    return it;
                  });
                  finalVal = JSON.stringify(updatedIn);
                }
              }
            } catch (e) {}

            localStorage.setItem(data.key, finalVal);
            localStorage.setItem(data.key + '_ts', String(incomingTs));
            localStorage.setItem(data.key + '_initialized', 'true');

            if (masterBroadcastChannel) {
              masterBroadcastChannel.postMessage({
                type: 'WWI_HUB_BROADCAST',
                key: data.key,
                value: finalVal,
                ts: incomingTs
              });
            }
          }

          event.source.postMessage({
            type: 'WWI_HUB_SAVED',
            reqId: data.reqId,
            key: data.key
          }, event.origin);
        } catch (err) {}
      } else if (data.type === 'WWI_HUB_GET_ALL') {
        try {
          var payload = {};
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('wwi_') === 0) {
              payload[k] = localStorage.getItem(k);
            }
          }
          event.source.postMessage({
            type: 'WWI_HUB_ALL_RESPONSE',
            payload: payload
          }, event.origin);
        } catch (err) {}
      }
    });

    window.addEventListener('storage', function (e) {
      if (
        e.key &&
        e.key.indexOf('wwi_') === 0 &&
        e.key.indexOf('_ts') === -1 &&
        e.key.indexOf('_initialized') === -1 &&
        e.newValue !== null &&
        window.parent &&
        window.parent !== window
      ) {
        var ts = localStorage.getItem(e.key + '_ts');
        window.parent.postMessage({
          type: 'WWI_HUB_SYNC_INCOMING',
          key: e.key,
          value: e.newValue,
          ts: ts ? parseInt(ts, 10) : 0
        }, '*');
      }
    });

    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'WWI_HUB_READY' }, '*');
      }
    } catch (e) {}
  </script>
</body>
</html>
